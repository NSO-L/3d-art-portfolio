<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>照片上传 | Photo Upload</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #FF6B6B;
            --color-secondary: #4ECDC4;
            --color-bg: #FAFAFA;
            --color-text: #2D3436;
            --color-text-light: #636E72;
            --color-white: #FFFFFF;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.12);
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 30px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 80px 0 60px;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            animation: fadeInUp 0.8s ease;
        }

        .hero p {
            font-size: 1.125rem;
            color: var(--color-text-light);
            font-weight: 300;
            animation: fadeInUp 0.8s ease 0.2s both;
        }

        /* Upload Area */
        .upload-section {
            margin-bottom: 60px;
        }

        .upload-area {
            background: var(--color-white);
            border: 3px dashed var(--color-secondary);
            border-radius: var(--radius-lg);
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.8s ease 0.4s both;
        }

        .upload-area::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(78, 205, 196, 0.05), rgba(255, 107, 107, 0.05));
            opacity: 0;
            transition: var(--transition);
        }

        .upload-area:hover {
            border-color: var(--color-primary);
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .upload-area:hover::before {
            opacity: 1;
        }

        .upload-area.dragover {
            border-color: var(--color-primary);
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.1), rgba(78, 205, 196, 0.1));
            transform: scale(1.02);
        }

        .upload-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            position: relative;
            z-index: 1;
        }

        .upload-icon svg {
            width: 100%;
            height: 100%;
            color: var(--color-secondary);
            transition: var(--transition);
        }

        .upload-area:hover .upload-icon svg {
            color: var(--color-primary);
            transform: translateY(-8px);
        }

        .upload-text {
            position: relative;
            z-index: 1;
        }

        .upload-text h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: var(--color-text);
        }

        .upload-text p {
            color: var(--color-text-light);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .upload-btn {
            display: inline-block;
            padding: 14px 40px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            color: var(--color-white);
            border: none;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
            position: relative;
            z-index: 1;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 107, 107, 0.4);
        }

        .upload-btn:active {
            transform: translateY(0);
        }

        #fileInput {
            display: none;
        }

        /* Features Section */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 60px;
            animation: fadeInUp 0.8s ease 0.6s both;
        }

        .feature-card {
            background: var(--color-white);
            padding: 32px 24px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            text-align: center;
        }

        .feature-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-md);
        }

        .feature-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.1), rgba(78, 205, 196, 0.1));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .feature-icon svg {
            width: 28px;
            height: 28px;
            color: var(--color-primary);
        }

        .feature-card h4 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: var(--color-text);
        }

        .feature-card p {
            font-size: 0.9rem;
            color: var(--color-text-light);
        }

        /* Gallery Section */
        .gallery-section {
            margin-bottom: 80px;
        }

        .gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            animation: fadeInUp 0.8s ease 0.8s both;
        }

        .gallery-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--color-text);
        }

        .clear-btn {
            padding: 10px 24px;
            background: transparent;
            color: var(--color-text-light);
            border: 2px solid var(--color-text-light);
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .clear-btn:hover {
            color: var(--color-primary);
            border-color: var(--color-primary);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .photo-card {
            background: var(--color-white);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            position: relative;
            animation: scaleIn 0.4s ease;
        }

        .photo-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }

        .photo-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            transition: var(--transition);
        }

        .photo-card:hover .photo-img {
            transform: scale(1.05);
        }

        .photo-info {
            padding: 20px;
        }

        .photo-name {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--color-text);
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .photo-size {
            font-size: 0.85rem;
            color: var(--color-text-light);
        }

        .photo-actions {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: var(--transition);
        }

        .photo-card:hover .photo-actions {
            opacity: 1;
        }

        .action-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: var(--color-white);
            color: var(--color-text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
        }

        .action-btn:hover {
            transform: scale(1.1);
        }

        .action-btn.download:hover {
            color: var(--color-secondary);
        }

        .action-btn.delete:hover {
            color: var(--color-primary);
        }

        .action-btn svg {
            width: 18px;
            height: 18px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 40px;
            color: var(--color-text-light);
            animation: fadeInUp 0.8s ease 1s both;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            color: var(--color-text-light);
            opacity: 0.5;
            margin-bottom: 20px;
        }

        .empty-state p {
            font-size: 1.1rem;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 0;
            color: var(--color-text-light);
            font-size: 0.9rem;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .hero {
                padding: 60px 0 40px;
            }

            .upload-area {
                padding: 40px 24px;
            }

            .gallery {
                grid-template-columns: 1fr;
            }

            .gallery-header {
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Hero Section -->
        <section class="hero">
            <h1>📸 照片上传</h1>
            <p>轻松上传、预览和管理你的精彩瞬间</p>
        </section>

        <!-- Upload Section -->
        <section class="upload-section">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                </div>
                <div class="upload-text">
                    <h3>拖拽照片到这里</h3>
                    <p>或者点击选择文件</p>
                    <p style="font-size: 0.85rem; margin-top: 8px;">支持 JPG, PNG, GIF, WebP</p>
                    <button class="upload-btn" id="uploadBtn">选择照片</button>
                </div>
                <input type="file" id="fileInput" accept="image/*" multiple>
            </div>
        </section>

        <!-- Features Section -->
        <section class="features">
            <div class="feature-card">
                <div class="feature-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                </div>
                <h4>拖拽上传</h4>
                <p>简单便捷的拖拽上传体验</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                </div>
                <h4>本地存储</h4>
                <p>照片安全保存在浏览器中</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                </div>
                <h4>一键下载</h4>
                <p>随时下载你的照片</p>
            </div>
        </section>

        <!-- Gallery Section -->
        <section class="gallery-section" id="gallerySection">
            <div class="gallery-header">
                <h2>我的照片</h2>
                <button class="clear-btn" id="clearBtn" style="display: none;">清空全部</button>
            </div>
            <div class="gallery" id="gallery"></div>
        </section>
    </div>

    <footer>
        <p>❤️ 用心设计，简单易用</p>
    </footer>

    <script>
        // DOM Elements
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const gallery = document.getElementById('gallery');
        const clearBtn = document.getElementById('clearBtn');
        const gallerySection = document.getElementById('gallerySection');

        // Storage
        const STORAGE_KEY = 'photoUploaderPhotos';
        let photos = [];

        // Initialize
        function init() {
            loadPhotos();
            renderGallery();
            setupEventListeners();
        }

        // Load photos from localStorage
        function loadPhotos() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                photos = JSON.parse(stored);
            }
        }

        // Save photos to localStorage
        function savePhotos() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(photos));
        }

        // Setup event listeners
        function setupEventListeners() {
            // Upload button click
            uploadBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                fileInput.click();
            });

            // Upload area click
            uploadArea.addEventListener('click', () => {
                fileInput.click();
            });

            // File input change
            fileInput.addEventListener('change', handleFileSelect);

            // Drag and drop
            uploadArea.addEventListener('dragover', handleDragOver);
            uploadArea.addEventListener('dragleave', handleDragLeave);
            uploadArea.addEventListener('drop', handleDrop);

            // Clear button
            clearBtn.addEventListener('click', clearAllPhotos);
        }

        // Handle drag over
        function handleDragOver(e) {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        }

        // Handle drag leave
        function handleDragLeave(e) {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
        }

        // Handle drop
        function handleDrop(e) {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            processFiles(files);
        }

        // Handle file select
        function handleFileSelect(e) {
            const files = e.target.files;
            processFiles(files);
            fileInput.value = '';
        }

        // Process files
        function processFiles(files) {
            Array.from(files).forEach(file => {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const photo = {
                            id: Date.now() + Math.random().toString(36).substr(2, 9),
                            name: file.name,
                            dataURL: e.target.result,
                            size: file.size,
                            type: file.type,
                            uploadTime: Date.now()
                        };
                        photos.unshift(photo);
                        savePhotos();
                        renderGallery();
                    };
                    reader.readAsDataURL(file);
                }
            });
        }

        // Format file size
        function formatSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Render gallery
        function renderGallery() {
            if (photos.length === 0) {
                gallery.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                        <p>还没有上传照片，开始上传第一张吧！</p>
                    </div>
                `;
                clearBtn.style.display = 'none';
                return;
            }

            clearBtn.style.display = 'block';
            gallery.innerHTML = photos.map(photo => `
                <div class="photo-card" data-id="${photo.id}">
                    <div class="photo-actions">
                        <button class="action-btn download" title="下载" onclick="downloadPhoto('${photo.id}')">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                            </svg>
                        </button>
                        <button class="action-btn delete" title="删除" onclick="deletePhoto('${photo.id}')">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </div>
                    <img src="${photo.dataURL}" alt="${photo.name}" class="photo-img">
                    <div class="photo-info">
                        <div class="photo-name">${photo.name}</div>
                        <div class="photo-size">${formatSize(photo.size)}</div>
                    </div>
                </div>
            `).join('');
        }

        // Download photo
        function downloadPhoto(id) {
            const photo = photos.find(p => p.id === id);
            if (photo) {
                const link = document.createElement('a');
                link.href = photo.dataURL;
                link.download = photo.name;
                link.click();
            }
        }

        // Delete photo
        function deletePhoto(id) {
            photos = photos.filter(p => p.id !== id);
            savePhotos();
            renderGallery();
        }

        // Clear all photos
        function clearAllPhotos() {
            if (confirm('确定要删除所有照片吗？')) {
                photos = [];
                savePhotos();
                renderGallery();
            }
        }

        // Make functions globally available
        window.downloadPhoto = downloadPhoto;
        window.deletePhoto = deletePhoto;

        // Initialize app
        init();
    </script>
</body>
</html>
