<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>比心手势识别 | Heart Gesture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .video-wrapper {
            position: relative;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 1.5rem;
        }

        video, canvas {
            display: block;
            width: 100%;
            border-radius: 20px;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        .status {
            text-align: center;
            padding: 1rem 2rem;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .status.detected {
            background: rgba(255, 100, 150, 0.3);
            border-color: rgba(255, 100, 150, 0.5);
            animation: pulse 0.5s ease;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .instructions {
            margin-top: 2rem;
            text-align: center;
            color: white;
            font-size: 0.9rem;
            opacity: 0.85;
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-text {
            color: white;
            font-size: 1.5rem;
            margin-top: 1.5rem;
            font-weight: 600;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .header p {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">正在加载模型...</div>
    </div>

    <div class="container">
        <div class="header">
            <h1>💖 比心手势识别</h1>
            <p>在摄像头前比心，触发爱心动画！</p>
        </div>

        <div class="video-wrapper">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas"></canvas>
        </div>

        <div class="status" id="status">等待检测...</div>

        <div class="instructions">
            提示：将双手在摄像头前比出爱心形状 ✌️→❤️
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script>
        const videoElement = document.getElementById('video');
        const canvasElement = document.getElementById('canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusElement = document.getElementById('status');
        const loadingElement = document.getElementById('loading');

        let hearts = [];
        let lastHeartTime = 0;
        const HEART_COOLDOWN = 500;

        function drawHeart(ctx, x, y, size, color, alpha) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x, y + size / 4);
            ctx.bezierCurveTo(x, y, x - size / 2, y, x - size / 2, y + size / 4);
            ctx.bezierCurveTo(x - size / 2, y + size / 2, x, y + size * 3 / 4, x, y + size);
            ctx.bezierCurveTo(x, y + size * 3 / 4, x + size / 2, y + size / 2, x + size / 2, y + size / 4);
            ctx.bezierCurveTo(x + size / 2, y, x, y, x, y + size / 4);
            ctx.fill();
            ctx.restore();
        }

        class Heart {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = 30;
                this.maxSize = 80;
                this.alpha = 1;
                this.color = `hsl(${Math.random() * 60 + 330}, 100%, 65%)`;
                this.vx = (Math.random() - 0.5) * 3;
                this.vy = -Math.random() * 3 - 2;
                this.growth = 2;
                this.decay = 0.02;
                this.life = 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.1;
                if (this.size < this.maxSize) {
                    this.size += this.growth;
                }
                this.life -= this.decay;
                this.alpha = this.life;
            }

            draw(ctx) {
                drawHeart(ctx, this.x, this.y, this.size, this.color, this.alpha);
                drawHeart(ctx, this.x + 5, this.y + 5, this.size * 0.7, this.color, this.alpha * 0.5);
            }

            isAlive() {
                return this.life > 0;
            }
        }

        function isHeartGesture(landmarks1, landmarks2) {
            if (!landmarks1 || !landmarks2) return false;

            const thumbTip1 = landmarks1[4];
            const indexTip1 = landmarks1[8];
            const thumbTip2 = landmarks2[4];
            const indexTip2 = landmarks2[8];

            const distThumbs = Math.sqrt(
                Math.pow(thumbTip1.x - thumbTip2.x, 2) + 
                Math.pow(thumbTip1.y - thumbTip2.y, 2)
            );
            const distIndices = Math.sqrt(
                Math.pow(indexTip1.x - indexTip2.x, 2) + 
                Math.pow(indexTip1.y - indexTip2.y, 2)
            );

            const middleTip1 = landmarks1[12];
            const middleTip2 = landmarks2[12];
            const wrist1 = landmarks1[0];
            const wrist2 = landmarks2[0];

            const handDistance = Math.sqrt(
                Math.pow(wrist1.x - wrist2.x, 2) + 
                Math.pow(wrist1.y - wrist2.y, 2)
            );

            const fingersClose1 = Math.sqrt(
                Math.pow(indexTip1.x - middleTip1.x, 2) + 
                Math.pow(indexTip1.y - middleTip1.y, 2)
            ) < 0.1;
            const fingersClose2 = Math.sqrt(
                Math.pow(indexTip2.x - middleTip2.x, 2) + 
                Math.pow(indexTip2.y - middleTip2.y, 2)
            ) < 0.1;

            return distThumbs < 0.15 && 
                   distIndices < 0.15 && 
                   handDistance < 0.4 && 
                   handDistance > 0.1 &&
                   fingersClose1 && 
                   fingersClose2;
        }

        function getHeartCenter(landmarks1, landmarks2) {
            const thumbTip1 = landmarks1[4];
            const indexTip1 = landmarks1[8];
            const thumbTip2 = landmarks2[4];
            const indexTip2 = landmarks2[8];

            return {
                x: (thumbTip1.x + indexTip1.x + thumbTip2.x + indexTip2.x) / 4,
                y: (thumbTip1.y + indexTip1.y + thumbTip2.y + indexTip2.y) / 4
            };
        }

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            canvasCtx.drawImage(
                results.image, 0, 0, canvasElement.width, canvasElement.height
            );

            let heartDetected = false;
            let heartCenter = null;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length >= 2) {
                if (isHeartGesture(results.multiHandLandmarks[0], results.multiHandLandmarks[1])) {
                    heartDetected = true;
                    heartCenter = getHeartCenter(results.multiHandLandmarks[0], results.multiHandLandmarks[1]);
                    
                    const now = Date.now();
                    if (now - lastHeartTime > HEART_COOLDOWN) {
                        hearts.push(new Heart(
                            heartCenter.x * canvasElement.width,
                            heartCenter.y * canvasElement.height
                        ));
                        lastHeartTime = now;
                    }
                }
            }

            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {
                        color: '#00FF00',
                        lineWidth: 2
                    });
                    drawLandmarks(canvasCtx, landmarks, {
                        color: '#FF0000',
                        lineWidth: 1,
                        radius: 3
                    });
                }
            }

            hearts = hearts.filter(heart => heart.isAlive());
            hearts.forEach(heart => {
                heart.update();
                heart.draw(canvasCtx);
            });

            if (heartDetected) {
                statusElement.textContent = '❤️ 爱心检测中！';
                statusElement.classList.add('detected');
            } else {
                statusElement.textContent = '等待检测...';
                statusElement.classList.remove('detected');
            }

            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });

        camera.start().then(() => {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            loadingElement.classList.add('hidden');
        });
    </script>
</body>
</html>
